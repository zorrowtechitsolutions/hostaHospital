
name: Deploy Hosta Hospital

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HOSTA_MAIN: ${{ secrets.HOSTA_MAIN }}
      HOSTA_TEST: ${{ secrets.HOSTA_TEST }}

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ============================================================
      # 3. Install Vercel CLI
      # ============================================================
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ============================================================
      # 4. Clean Vercel configuration
      # ============================================================
      - name: Prepare Vercel project
        shell: bash
        run: |
          set -e

          rm -rf .vercel

      # ============================================================
      # 5. Select correct environment
      # ============================================================
      - name: Select environment file
        shell: bash
        run: |
          set -e

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Using HOSTA_MAIN"
            printf '%s' "$HOSTA_MAIN" > .env.deploy

          elif [ "$GITHUB_REF_NAME" = "test" ]; then
            echo "Using HOSTA_TEST"
            printf '%s' "$HOSTA_TEST" > .env.deploy

          else
            echo "Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

          if [ ! -s .env.deploy ]; then
            echo "ERROR: .env.deploy is empty"
            exit 1
          fi

      # ============================================================
      # 6. Validate API URL
      # ============================================================
      - name: Validate API URL
        shell: bash
        run: |
          set -e

          API_LINE=$(grep '^VITE_API_URL=' .env.deploy || true)

          if [ -z "$API_LINE" ]; then
            echo "ERROR: VITE_API_URL is missing"
            exit 1
          fi

          API_URL="${API_LINE#*=}"

          # Remove double quotes
          API_URL="${API_URL%\"}"
          API_URL="${API_URL#\"}"

          # Remove single quotes
          API_URL="${API_URL%\'}"
          API_URL="${API_URL#\'}"

          echo "VITE_API_URL is configured."

          # Must be HTTPS
          if [[ "$API_URL" != https://* ]]; then
            echo "ERROR: VITE_API_URL must use HTTPS."
            exit 1
          fi

          # Prevent the old HTTP IP from returning
          if [[ "$API_URL" == *"18.141.233.52"* ]]; then
            echo "ERROR: Old API IP detected."
            exit 1
          fi

          # Test branch must use the HTTPS ngrok API
          if [ "$GITHUB_REF_NAME" = "test" ]; then

            EXPECTED="https://supplier-preaching-breezy.ngrok-free.dev/api"

            if [ "$API_URL" != "$EXPECTED" ]; then
              echo "ERROR: Test API URL is incorrect."
              echo "Expected:"
              echo "$EXPECTED"
              exit 1
            fi

          fi

      # ============================================================
      # 7. Sync environment variables to Vercel
      # ============================================================
      - name: Sync environment variables to Vercel
        shell: bash
        run: |
          set -e

          while IFS= read -r line || [ -n "$line" ]; do

            # Skip empty lines
            [ -z "$line" ] && continue

            # Skip comments
            case "$line" in
              \#*) continue ;;
            esac

            # Remove optional export prefix
            line="${line#export }"

            # Ignore malformed lines
            case "$line" in
              *=*) ;;
              *) continue ;;
            esac

            KEY="${line%%=*}"
            VALUE="${line#*=}"

            # Remove surrounding double quotes
            if [[ "$VALUE" == \"*\" ]]; then
              VALUE="${VALUE:1:${#VALUE}-2}"
            fi

            # Remove surrounding single quotes
            if [[ "$VALUE" == \'*\' ]]; then
              VALUE="${VALUE:1:${#VALUE}-2}"
            fi

            echo "Syncing $KEY"

            # VITE variables are frontend configuration.
            # Everything else is stored as a secret.
            if [[ "$KEY" == VITE_* ]]; then
              TYPE="config"
            else
              TYPE="secret"
            fi

            if [ "$GITHUB_REF_NAME" = "main" ]; then

              vercel env add "$KEY" production \
                --value "$VALUE" \
                --type "$TYPE" \
                --force \
                --yes \
                --token "$VERCEL_TOKEN"

            elif [ "$GITHUB_REF_NAME" = "test" ]; then

              vercel env add "$KEY" preview \
                --value "$VALUE" \
                --type "$TYPE" \
                --force \
                --yes \
                --token "$VERCEL_TOKEN"

            fi

          done < .env.deploy

          rm -f .env.deploy

      # ============================================================
      # 8. Deploy directly to Vercel
      #
      # Vercel will:
      #   - install npm dependencies
      #   - load Vercel environment variables
      #   - run the Vite build
      #   - deploy the application
      # ============================================================
      - name: Deploy to Vercel
        shell: bash
        run: |
          set -e

          if [ "$GITHUB_REF_NAME" = "main" ]; then

            echo "Deploying MAIN to Vercel Production"

            vercel deploy \
              --prod \
              --yes \
              --token "$VERCEL_TOKEN"

          elif [ "$GITHUB_REF_NAME" = "test" ]; then

            echo "Deploying TEST to Vercel Preview"

            vercel deploy \
              --yes \
              --token "$VERCEL_TOKEN"

          else

            echo "Unsupported branch: $GITHUB_REF_NAME"
            exit 1

          fi


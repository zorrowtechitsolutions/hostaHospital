name: Deploy Hosta Hospital

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout source code
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      # Do NOT use cache: npm because the repository does not
      # currently contain package-lock.json.
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # =========================================================
      # 3. Setup npm
      # =========================================================
      # Pin npm to avoid the Arborist "edgesOut" error that
      # occurred during npm install on the GitHub runner.
      # =========================================================
      - name: Setup npm
        run: |
          npm install -g npm@10.8.2
          npm --version
          node --version


      # =========================================================
      # 4. Clean npm cache
      # =========================================================
      - name: Clean npm cache
        run: |
          npm cache clean --force
          rm -rf ~/.npm/_cacache


      # =========================================================
      # 5. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          echo "Installing dependencies..."

          npm install \
            --no-audit \
            --no-fund \
            --prefer-online \
            --legacy-peer-deps


      # =========================================================
      # 6. Install Vercel CLI
      # =========================================================
      - name: Install Vercel CLI
        run: |
          npm install --global vercel@latest
          vercel --version


      # =========================================================
      # 7. Clean previous Vercel metadata
      # =========================================================
      - name: Clean Vercel configuration
        run: |
          rm -rf .vercel


      # =========================================================
      # 8. Configure API URL
      # =========================================================
      - name: Configure deployment environment
        env:
          HOSTA_MAIN: ${{ secrets.HOSTA_MAIN }}
          HOSTA_TEST: ${{ secrets.HOSTA_TEST }}
        run: |

          if [ "$GITHUB_REF_NAME" = "main" ]; then

            echo "VITE_API_URL=$HOSTA_MAIN" > .env.deploy

            echo "======================================"
            echo "DEPLOYMENT: MAIN"
            echo "======================================"

          elif [ "$GITHUB_REF_NAME" = "test" ]; then

            echo "VITE_API_URL=$HOSTA_TEST" > .env.deploy

            echo "======================================"
            echo "DEPLOYMENT: TEST"
            echo "======================================"

          else

            echo "ERROR: Unsupported branch:"
            echo "$GITHUB_REF_NAME"

            exit 1

          fi

          echo ""
          echo "Selected API configuration:"
          cat .env.deploy


      # =========================================================
      # 9. Validate API URL
      # =========================================================
      - name: Validate API URL
        run: |

          API_LINE=$(grep '^VITE_API_URL=' .env.deploy || true)

          if [ -z "$API_LINE" ]; then
            echo "ERROR: VITE_API_URL is missing."
            exit 1
          fi

          API_URL="${API_LINE#VITE_API_URL=}"

          echo ""
          echo "Checking API URL..."
          echo "API URL: $API_URL"
          echo ""

          # Must be HTTPS
          if [[ "$API_URL" != https://* ]]; then

            echo "ERROR: API URL must use HTTPS."

            exit 1

          fi

          # Old IP must never be allowed
          if [[ "$API_URL" == *"18.141.233.52"* ]]; then

            echo "ERROR: OLD API IP DETECTED!"
            echo "$API_URL"

            exit 1

          fi

          # Test branch must use the ngrok API
          if [ "$GITHUB_REF_NAME" = "test" ]; then

            EXPECTED="https://supplier-preaching-breezy.ngrok-free.dev/api"

            if [ "$API_URL" != "$EXPECTED" ]; then

              echo "ERROR: TEST API URL IS WRONG."

              echo "Expected:"
              echo "$EXPECTED"

              echo "Actual:"
              echo "$API_URL"

              exit 1

            fi

          fi

          echo "======================================"
          echo "API URL VALIDATION PASSED"
          echo "======================================"


      # =========================================================
      # 10. Sync VITE_API_URL to Vercel
      # =========================================================
      
      - name: Sync VITE_API_URL to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HOSTA_MAIN: ${{ secrets.HOSTA_MAIN }}
          HOSTA_TEST: ${{ secrets.HOSTA_TEST }}
        run: |

          echo "Linking Vercel project..."

          vercel link \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --yes

          if [ "$GITHUB_REF_NAME" = "main" ]; then

            API_URL="$HOSTA_MAIN"

            echo "Syncing MAIN API URL to Vercel..."

            printf "%s" "$API_URL" | \
              vercel env add VITE_API_URL production \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --force

          elif [ "$GITHUB_REF_NAME" = "test" ]; then

            API_URL="$HOSTA_TEST"

            echo "Syncing TEST API URL to Vercel..."

            printf "%s" "$API_URL" | \
              vercel env add VITE_API_URL preview test \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --force

          else

            echo "ERROR: Unsupported branch $GITHUB_REF_NAME"
            exit 1

          fi

          echo "VITE_API_URL synced successfully."



      # =========================================================
      # 11. Pull Vercel Preview environment
      # =========================================================
      - name: Pull Vercel Production environment
        if: github.ref_name == 'main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |

          echo "Pulling Vercel Production configuration..."

          vercel pull \
            --yes \
            --environment=production \
            --project="$VERCEL_PROJECT_ID" \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"

          echo "Vercel Production configuration pulled."


      # =========================================================
      # 12. Pull Vercel Production environment
      # =========================================================
      - name: Pull Vercel Production environment
        if: github.ref_name == 'main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |

          echo "Pulling Vercel Production configuration..."

          vercel pull \
            --yes \
            --environment=production \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID"

          echo "Vercel Production configuration pulled."


      # =========================================================
      # 13. Show Vercel environment configuration
      # =========================================================
      - name: Show Vercel configuration
        run: |

          echo "======================================"
          echo "VERCEL DIRECTORY"
          echo "======================================"

          if [ -d ".vercel" ]; then
            find .vercel -maxdepth 3 -type f -print
          else
            echo "ERROR: .vercel directory was not created."
            exit 1
          fi


      # =========================================================
      # 14. Build Vercel artifact
      # =========================================================
      # IMPORTANT:
      #
      # This is the build that will actually be deployed.
      #
      # We do NOT use npm run build here.
      # Vercel creates .vercel/output through vercel build.
      # =========================================================
      - name: Build Vercel artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |

          echo "======================================"
          echo "BUILDING VERCEL ARTIFACT"
          echo "======================================"

          if [ "$GITHUB_REF_NAME" = "main" ]; then

            vercel build \
              --prod \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID"

          elif [ "$GITHUB_REF_NAME" = "test" ]; then

            vercel build \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID"

          fi

          echo ""
          echo "Vercel build completed."


      # =========================================================
      # 15. Verify Vercel artifact exists
      # =========================================================
      - name: Verify Vercel output
        run: |

          echo "Checking .vercel/output..."

          if [ ! -d ".vercel/output" ]; then

            echo "ERROR: .vercel/output does not exist."

            exit 1

          fi

          echo ""
          echo "Vercel output exists."

          echo ""
          echo "Generated files:"
          find .vercel/output -type f | head -100


      # =========================================================
      # 16. CRITICAL CHECK
      #
      # Search the ACTUAL artifact that will be uploaded to
      # Vercel for the old API IP.
      # =========================================================
      - name: Check Vercel artifact for old IP
        run: |

          echo ""
          echo "======================================"
          echo "CHECKING FOR OLD API IP"
          echo "======================================"

          if grep -R \
            "18.141.233.52" \
            .vercel/output \
            --exclude="*.map"; then

            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "ERROR: OLD API IP FOUND"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "SUCCESS"
          echo "Old API IP was NOT found."
          echo "======================================"


      # =========================================================
      # 17. Check expected TEST API URL
      # =========================================================
      - name: Check expected TEST API URL
        if: github.ref_name == 'test'
        run: |

          echo ""
          echo "======================================"
          echo "CHECKING FOR CORRECT API URL"
          echo "======================================"

          if grep -R \
            "supplier-preaching-breezy.ngrok-free.dev/api" \
            .vercel/output \
            --exclude="*.map"; then

            echo ""
            echo "SUCCESS:"
            echo "Correct ngrok API URL found."

          else

            echo ""
            echo "ERROR:"
            echo "Correct ngrok API URL was NOT found."

            exit 1

          fi


      # =========================================================
      # 18. Deploy EXACT prebuilt artifact
      # =========================================================
      # --prebuilt tells Vercel to upload .vercel/output
      # instead of rebuilding the source again.
      # =========================================================
      - name: Deploy prebuilt artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |

          echo "======================================"
          echo "DEPLOYING PREBUILT ARTIFACT"
          echo "======================================"

          if [ "$GITHUB_REF_NAME" = "main" ]; then

            vercel deploy \
              --prebuilt \
              --prod \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --yes

          elif [ "$GITHUB_REF_NAME" = "test" ]; then

            vercel deploy \
              --prebuilt \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --yes

          fi

          echo ""
          echo "======================================"
          echo "DEPLOYMENT COMPLETE"
          echo "======================================"
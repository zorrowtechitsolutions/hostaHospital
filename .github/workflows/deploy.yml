name: Deploy Hosta Hospital
# Team-scoped Vercel deployment

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      HOSTA_MAIN: ${{ secrets.HOSTA_MAIN }}
      HOSTA_TEST: ${{ secrets.HOSTA_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Update npm
        run: npm install --global npm@11.19.1

      - name: Prepare Vercel project
        shell: bash
        run: |
          rm -rf .vercel

      - name: Select environment file
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            printf '%s' "$HOSTA_MAIN" > .env.deploy
          else
            printf '%s' "$HOSTA_TEST" > .env.deploy
          fi

      - name: Sync environment variables to Vercel
        shell: bash
        run: |
          set -e

          while IFS= read -r line || [ -n "$line" ]; do

            [ -z "$line" ] && continue

            case "$line" in
              \#*) continue ;;
            esac

            line="${line#export }"

            case "$line" in
              *=*) ;;
              *) continue ;;
            esac

            KEY="${line%%=*}"
            VALUE="${line#*=}"

            if [[ "$VALUE" == \"*\" ]]; then
              VALUE="${VALUE:1:${#VALUE}-2}"
            fi

            if [[ "$VALUE" == \'*\' ]]; then
              VALUE="${VALUE:1:${#VALUE}-2}"
            fi

            echo "Syncing $KEY"

            if [[ "$KEY" == VITE_* ]]; then
              TYPE="config"
            else
              TYPE="secret"
            fi

            if [ "$GITHUB_REF_NAME" = "main" ]; then

              vercel env add "$KEY" production \
                --value "$VALUE" \
                --type "$TYPE" \
                --force \
                --yes \
                --token "$VERCEL_TOKEN"

            else

              vercel env add "$KEY" preview test \
                --value "$VALUE" \
                --type "$TYPE" \
                --force \
                --yes \
                --token "$VERCEL_TOKEN"

            fi

          done < .env.deploy

          rm -f .env.deploy

      - name: Install project dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to Vercel
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            vercel deploy --yes --token "$VERCEL_TOKEN"
          fi
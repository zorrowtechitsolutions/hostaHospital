
name: Deploy Hosta Hospital

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
        node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 5. Remove old Vercel project configuration
      - name: Clean Vercel configuration
        run: rm -rf .vercel

      # 6. Select the correct API URL
      - name: Configure deployment environment
        env:
          HOSTA_MAIN: ${{ secrets.HOSTA_MAIN }}
          HOSTA_TEST: ${{ secrets.HOSTA_TEST }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "VITE_API_URL=$HOSTA_MAIN" > .env.deploy
            echo "Deploying MAIN"
          elif [ "$GITHUB_REF_NAME" = "test" ]; then
            echo "VITE_API_URL=$HOSTA_TEST" > .env.deploy
            echo "Deploying TEST"
          else
            echo "Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

          echo "Selected API configuration:"
          grep '^VITE_API_URL=' .env.deploy

      # 7. Validate API URL before deployment
      - name: Validate API URL
        run: |
          API_LINE=$(grep '^VITE_API_URL=' .env.deploy || true)

          if [ -z "$API_LINE" ]; then
            echo "ERROR: VITE_API_URL is missing."
            exit 1
          fi

          API_URL="${API_LINE#VITE_API_URL=}"

          echo "VITE_API_URL is configured."

          if [[ "$API_URL" != https://* ]]; then
            echo "ERROR: VITE_API_URL must use HTTPS."
            exit 1
          fi

          if [[ "$API_URL" == *"18.141.233.52"* ]]; then
            echo "ERROR: Old API IP detected:"
            echo "$API_URL"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "test" ]; then
            EXPECTED="https://supplier-preaching-breezy.ngrok-free.dev/api"

            if [ "$API_URL" != "$EXPECTED" ]; then
              echo "ERROR: TEST API URL is incorrect."
              echo "Expected: $EXPECTED"
              echo "Actual:   $API_URL"
              exit 1
            fi
          fi

      # 8. Sync VITE_API_URL to Vercel
      - name: Sync VITE_API_URL to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          API_URL=$(grep '^VITE_API_URL=' .env.deploy | cut -d '=' -f2-)

          echo "Syncing VITE_API_URL to Vercel..."

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            printf "%s" "$API_URL" | vercel env add VITE_API_URL production \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --force

          elif [ "$GITHUB_REF_NAME" = "test" ]; then
            printf "%s" "$API_URL" | vercel env add VITE_API_URL preview test \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --force
          fi

      # 9. Build locally as an additional safety check
      - name: Build application
        env:
          VITE_API_URL: ${{ secrets.HOSTA_TEST }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            export VITE_API_URL="${{ secrets.HOSTA_MAIN }}"
          else
            export VITE_API_URL="${{ secrets.HOSTA_TEST }}"
          fi

          echo "Building application..."
          npm run build

          echo "Checking generated bundle for old API IP..."

          if grep -R "18.141.233.52" dist --include="*.js" --include="*.html" --include="*.css"; then
            echo "ERROR: Old API IP was found in the generated build."
            exit 1
          fi

          echo "SUCCESS: Old API IP was NOT found in local build."

      # 10. Deploy to Vercel
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Starting Vercel deployment..."

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Deploying MAIN to Vercel Production"

            vercel deploy \
              --prod \
              --force \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --yes

          elif [ "$GITHUB_REF_NAME" = "test" ]; then
            echo "Deploying TEST to Vercel Preview"

            vercel deploy \
              --force \
              --token "$VERCEL_TOKEN" \
              --scope "$VERCEL_ORG_ID" \
              --yes

          else
            echo "Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi